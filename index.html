  // ================= score: a space-traveller soundtrack synthesised live, following the picture =================
  const Music = (() => {
    let ac = null, master, bus, verb, verbIn, padFilter, padGain, droneGain, droneFilter, noiseGain, noiseFilter, arpGain, pulseGain;
    let pads = [], narrBuf = null, narrSrc = null, muted = false;
    let prevT = -1, nextArp = 0, arpI = 0, nextPulse = 0, chordName = '';
    const A2 = 110, hz = s => A2 * Math.pow(2, s/12);
    // voicings as semitones above A2
    const CHORDS = {
      Am:  [0, 7, 12, 15, 19],
      F:   [-4, 3, 8, 12, 19],
      C:   [3, 10, 15, 19, 26],
      G:   [-2, 5, 10, 14, 21],
      Em:  [-5, 2, 7, 10, 14],
      Dm:  [-7, 5, 8, 12, 17]
    };
    // a bright, rising progression for the story of salvation: C – G – F – C
    const MONTAGE = ['C', 'G', 'F', 'C'];

    function noiseBuffer(sec){
      const b = ac.createBuffer(1, ac.sampleRate*sec, ac.sampleRate), d = b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
      return b;
    }
    function impulse(sec, decay){
      const len = ac.sampleRate*sec, b = ac.createBuffer(2, len, ac.sampleRate);
      for(let c=0;c<2;c++){ const d = b.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay); }
      return b;
    }

    function build(){
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0;
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ac.destination);
      bus = ac.createGain(); bus.connect(master);
      verb = ac.createConvolver(); verb.buffer = impulse(4.5, 2.6);
      verbIn = ac.createGain(); verbIn.gain.value = .55; verbIn.connect(verb);
      const verbOut = ac.createGain(); verbOut.gain.value = .9; verb.connect(verbOut); verbOut.connect(master);

      // warm evolving pad: five detuned voices through a slowly opening filter
      padFilter = ac.createBiquadFilter(); padFilter.type = 'lowpass'; padFilter.frequency.value = 500; padFilter.Q.value = .6;
      padGain = ac.createGain(); padGain.gain.value = 0;
      padFilter.connect(padGain); padGain.connect(bus); padGain.connect(verbIn);
      for(let v=0; v<5; v++){
        const pair = [-6, 6].map(cents => {
          const o = ac.createOscillator(); o.type = v < 2 ? 'sawtooth' : 'triangle'; o.detune.value = cents;
          const g = ac.createGain(); g.gain.value = .045;
          o.connect(g); g.connect(padFilter); o.start();
          return o;
        });
        pads.push(pair);
      }
      const lfo = ac.createOscillator(), lfoAmt = ac.createGain();
      lfo.frequency.value = .07; lfoAmt.gain.value = 220; lfo.connect(lfoAmt); lfoAmt.connect(padFilter.frequency); lfo.start();

      // sub drone
      droneFilter = ac.createBiquadFilter(); droneFilter.type = 'lowpass'; droneFilter.frequency.value = 180;
      droneGain = ac.createGain(); droneGain.gain.value = 0;
      droneFilter.connect(droneGain); droneGain.connect(bus);
      [[55, 'sine', .5], [55.4, 'sawtooth', .12], [82.4, 'triangle', .18]].forEach(([f, type, lv]) => {
        const o = ac.createOscillator(); o.type = type; o.frequency.value = f;
        const g = ac.createGain(); g.gain.value = lv; o.connect(g); g.connect(droneFilter); o.start();
      });

      // wind / riser noise
      const n = ac.createBufferSource(); n.buffer = noiseBuffer(3); n.loop = true;
      noiseFilter = ac.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 400; noiseFilter.Q.value = .8;
      noiseGain = ac.createGain(); noiseGain.gain.value = 0;
      n.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(bus); noiseGain.connect(verbIn); n.start();

      // shimmering arpeggio through a dotted-eighth echo
      arpGain = ac.createGain(); arpGain.gain.value = 0;
      const delay = ac.createDelay(1.2), fb = ac.createGain(), wet = ac.createGain();
      delay.delayTime.value = .33; fb.gain.value = .42; wet.gain.value = .5;
      arpGain.connect(bus); arpGain.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(bus); wet.connect(verbIn);

      pulseGain = ac.createGain(); pulseGain.gain.value = 0; pulseGain.connect(bus);

      fetch('audio/narration.m4a').then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).then(buf => { narrBuf = buf; }).catch(() => {});
    }

    function setChord(name, glide = 1.2){
      if(chordName === name) return;
      chordName = name;
      const now = ac.currentTime;
      CHORDS[name].forEach((s, i) => pads[i].forEach(o => o.frequency.setTargetAtTime(hz(s), now, glide/3)));
    }
    const level = (param, v, tc = .8) => param.setTargetAtTime(v, ac.currentTime, tc);

    function pluck(time, freq, vel){
      const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = freq; o2.frequency.value = freq*2.001;
      const g2 = ac.createGain(); g2.gain.value = .25;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(arpGain);
      g.gain.setValueAtTime(0, time); g.gain.linearRampToValueAtTime(vel, time + .006); g.gain.exponentialRampToValueAtTime(.0008, time + .55);
      o.start(time); o2.start(time); o.stop(time + .6); o2.stop(time + .6);
    }
    function kick(time, vel){
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(140, time); o.frequency.exponentialRampToValueAtTime(42, time + .16);
      g.gain.setValueAtTime(vel, time); g.gain.exponentialRampToValueAtTime(.001, time + .32);
      o.connect(g); g.connect(pulseGain); o.start(time); o.stop(time + .34);
    }
    function boom(){
      const now = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(110, now); o.frequency.exponentialRampToValueAtTime(24, now + 1.8);
      g.gain.setValueAtTime(1.1, now); g.gain.exponentialRampToValueAtTime(.001, now + 2.6);
      o.connect(g); g.connect(bus); g.connect(verbIn); o.start(now); o.stop(now + 2.7);
      const n = ac.createBufferSource(); n.buffer = noiseBuffer(3);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(2400, now); f.frequency.exponentialRampToValueAtTime(120, now + 2.5);
      const ng = ac.createGain(); ng.gain.setValueAtTime(.9, now); ng.gain.exponentialRampToValueAtTime(.001, now + 2.8);
      n.connect(f); f.connect(ng); ng.connect(bus); ng.connect(verbIn); n.start(now); n.stop(now + 3);
    }
    function whoosh(dur, peak = .5){
      const now = ac.currentTime;
      const n = ac.createBufferSource(); n.buffer = noiseBuffer(dur + .5);
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(300, now); f.frequency.exponentialRampToValueAtTime(5000, now + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(.001, now); g.gain.exponentialRampToValueAtTime(peak, now + dur*.9); g.gain.exponentialRampToValueAtTime(.001, now + dur + .4);
      n.connect(f); f.connect(g); g.connect(bus); g.connect(verbIn); n.start(now); n.stop(now + dur + .5);
    }
    function playNarration(){
      if(!narrBuf) return;
      stopNarration();
      narrSrc = ac.createBufferSource(); narrSrc.buffer = narrBuf;
      const g = ac.createGain(); g.gain.value = 1.35;
      narrSrc.connect(g); g.connect(master); g.connect(verbIn);
      narrSrc.start();
    }
    function stopNarration(){ if(narrSrc){ try{ narrSrc.stop(); }catch(e){} narrSrc = null; } }

    function update(t){
      if(!ac) return;
      const crossed = x => prevT < x && t >= x;
      if(t < prevT - .5){ stopNarration(); chordName = ''; }

      // sections of the score
      let chord, pad, drone, arp, pulse, noise, cutoff, arpRate;
      if(t < BANG){ chord = 'Am'; pad = .5; drone = .55; arp = 0; pulse = 0; cutoff = 420 + 500*(t/BANG); arpRate = 0;
        noise = smooth(HEAT - .6, BANG, t)*.35; }
      // after the blast the score rests: warm major chords, soft slow bells, no beat
      else if(t < TITLE){ chord = 'F'; pad = .55; drone = .4; arp = .1; pulse = 0; noise = 0; cutoff = 1000; arpRate = .5; }
      else if(t < ZOOM0){ chord = t < TITLE + 3 ? 'C' : 'F'; pad = .5; drone = .32; arp = .08; pulse = 0; noise = 0; cutoff = 850; arpRate = .6; }
      else if(t < PLAN0){ chord = 'F'; pad = .6; drone = .38; arp = .22; pulse = 0; noise = smooth(ZOOM0, GAL_IN, t)*.08; cutoff = 1300; arpRate = .34; }
      else if(t < EARTH0){ chord = 'C'; pad = .62; drone = .38; arp = .26; pulse = 0; noise = .03; cutoff = 1500; arpRate = .3; }
      else if(t < DIVE0){ chord = 'F'; pad = .66; drone = .36; arp = .2; pulse = 0; noise = .02; cutoff = 1400; arpRate = .42; }
      // the dive home: the music turns to triumph as the story of God reaches its fulfilment
      else if(t < MON0){ chord = 'C'; pad = 1; drone = .85; arp = .55; pulse = .5; noise = smooth(DIVE0, DIVE1, t)*.45; cutoff = 3200; arpRate = .16; }
      else if(t < STORY_END + 1.5){
        const idx = Math.floor((t - MON0)/(MON_STEP*2));
        chord = MONTAGE[idx % MONTAGE.length]; pad = 1; drone = .85; arp = .7; pulse = .95; noise = 0; cutoff = 3200; arpRate = .125;
      } else { chord = 'C'; pad = .75; drone = .4; arp = .2; pulse = 0; noise = 0; cutoff = 1500; arpRate = .3; }

      // duck the music under the narrator
      const duck = ((t > TITLE + .3 && t < TITLE + 4.8) || narrating) ? .4 : 1;
      setChord(chord);
      level(padGain.gain, pad*.9*duck, .6);
      level(droneGain.gain, drone*.9*duck, .6);
      level(arpGain.gain, arp*.5*duck, .3);
      level(pulseGain.gain, pulse*.7, .15);
      level(noiseGain.gain, noise, .3);
      level(noiseFilter.frequency, 300 + noise*9000, .4);
      level(padFilter.frequency, cutoff, 1.2);

      if(crossed(BANG)) boom();
      if(crossed(TITLE + .02)) playNarration();
      if(crossed(ZOOM0)) whoosh(2.6, .18);
      if(crossed(DIVE0 + .2)) whoosh(1.6);

      // schedule arpeggio notes and montage beats a little ahead on the audio clock
      const now = ac.currentTime;
      if(arpRate > 0){
        if(nextArp < now) nextArp = now + .05;
        while(nextArp < now + .15){
          const tones = CHORDS[chordName];
          const s = tones[[0, 2, 3, 4, 3, 2][arpI++ % 6]] + 24;
          pluck(nextArp, hz(s), .16);
          nextArp += arpRate;
        }
      }
      if(pulse > 0){
        if(nextPulse < now) nextPulse = now + .05;
        while(nextPulse < now + .15){ kick(nextPulse, .9); nextPulse += MON_STEP/4; }
      }
      prevT = t;
    }

    return {
      start(){
        if(!ac) build();
        ac.resume();
        prevT = -1;
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.setTargetAtTime(muted ? 0 : .8, ac.currentTime, .5);
      },
      update,
      toggle(){
        muted = !muted;
        if(ac) master.gain.setTargetAtTime(muted ? 0 : .8, ac.currentTime, .15);
        return !muted;
      }
    };
  })();

  const planetCredit = document.getElementById('planetCredit');
  const MW_CREDIT = 'Milky Way: NASA/JPL-Caltech/ESO/R. Hurt, CC BY 4.0 · Star map: ESA/Gaia/DPAC, CC BY-SA 3.0 IGO';
  const PLANET_CREDIT = 'Planet imagery: NASA · JPL · USGS · Saturn map: Solar System Scope, CC BY 4.0';
  const EARTH_CREDIT = 'Earth: based on "EARTH" by Stéphane Agullo (sketchfab.com/sa3d), CC BY 4.0 · Moon: NASA';
  const FILM_CREDIT = 'Paintings: Michelangelo · Caravaggio · Rembrandt · Leonardo · Fra Angelico · Velázquez · Rubens · El Greco · Perugino · Doré — public domain · Building photographs: Wikimedia Commons, credited per scene';
  function stage(){
    if(t > REVEAL + 2) preloadMonuments();
    updateMonuments();
    try { Music.update(t); } catch(e) {}
    const creditText = t < PLAN0 - .3 ? MW_CREDIT : t < EARTH0 - .8 ? PLANET_CREDIT : t < MON0 ? EARTH_CREDIT : FILM_CREDIT;
    if(planetCredit.textContent !== creditText) planetCredit.textContent = creditText;
    planetCredit.classList.toggle('on', (t > ZOOM0 + .5 && t < DIVE0 + .4) || (t > MON0 && t < MON0 + 6));
    if(t > TITLE){ overlay.classList.add('show'); document.body.classList.add('titling'); }
    if(t > DEPART) overlay.classList.add('depart');
    if(t > STORY_END + 1) document.body.classList.add('done');
    clock.innerHTML = clockText();
  }

  // real-time clock: slow frames skip ahead instead of stretching the animation into slow motion
  let last = performance.now(), slowAvg = 1/60, perfChecks = 0, started = false;
  function frame(now){
    const raw = (now-last)/1000; last = now;
    const dt = started ? clamp(raw, 0, .1) : 0;
    slowAvg = lerp(slowAvg, dt, .05);
    // if the device still can't keep up, drop canvas resolution a notch (at most twice)
    if(started && t > 1.5 && slowAvg > 1/34 && perfChecks < 2 && dprCap > 1){
      dprCap = Math.max(1, dprCap - .5); perfChecks++; slowAvg = 1/60; resize();
    }
    // build the galaxy, planets and Earth in small slices during the lighter starfield/title scenes
    // shade the planets while nothing heavy is on screen: before the tap, or during the calm title scene
    if(!started || (t > REVEAL + 1 && t < ZOOM0)) bakeNextBody();
    step(dt); draw(); stage();
    requestAnimationFrame(frame);
  }

  function skipToEnd(){
    t = TITLE + .1; streaks = []; shards = []; puffs = []; orbSparks = []; spawnAcc = 0;
    draw(); stage();
  }

  const gate = document.getElementById('gate'), soundBtn = document.getElementById('soundBtn');
  // the picture always starts; sound is best-effort (some embedded/sandboxed pages block audio)
  function begin(){
    gate.classList.add('gone');
    init();
    started = true;
    try { Music.start(); } catch(e) {}
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) skipToEnd();
  }
  document.getElementById('gateBtn').addEventListener('click', begin);
  document.getElementById('againBtn').addEventListener('click', () => { init(); try { Music.start(); } catch(e) {} });
  document.getElementById('skipBtn').addEventListener('click', skipToEnd);
  soundBtn.addEventListener('click', () => {
    const on = Music.toggle();
    soundBtn.textContent = on ? 'Sound on' : 'Sound off';
    soundBtn.setAttribute('aria-pressed', String(on));
  });

  init();
  requestAnimationFrame(frame);
})();
</script>
